openapi: 3.0.0
info:
  title: commercetools Composable Commerce API
  version: v1
servers:
- url: https://api.us-central1.gcp.commercetools.com
paths:
  /{projectKey}/custom-objects:
    description: Store custom JSON values.
    parameters:
    - name: projectKey
      description: "The `key` of the Project."
      in: path
      required: true
      schema:
        type: string
    get:
      security:
      - oauth_2_0:
        - view_products:{projectKey}
        - view_orders:{projectKey}
        - view_customers:{projectKey}
        - view_key_value_documents:{projectKey}
      operationId: ByProjectKeyCustomObjectsGet
      summary: Query custom objects
      description: |-
        For performance reasons, it is highly advisable to query for Custom Objects in a container by using the `container` field in the `where` predicate.

        This endpoint is deprecated and replaced by the [Query CustomObjects in Container](ctp:api:endpoint:/{projectKey}/custom-objects/{container}:GET) endpoint.
      parameters:
      - name: expand
        description: "A field to expand. Reference fields can be expanded to include the referenced resource inline."
        in: query
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: sort
        description: "Sort expression; can be repeated to sort by several fields, for example `createdAt desc`."
        in: query
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: limit
        description: "Number of results to return per page. Defaults to 20, maximum 500."
        x-annotation-default: 20
        in: query
        required: false
        style: form
        schema:
          type: integer
        explode: true
      - name: offset
        description: "Number of results to skip, used for pagination. Defaults to 0, maximum 10000."
        x-annotation-default: 0
        in: query
        required: false
        style: form
        schema:
          type: integer
        explode: true
      - name: withTotal
        description: "If false, the total count is not calculated, which improves performance of paged queries. Defaults to true."
        x-annotation-default: true
        in: query
        required: false
        style: form
        schema:
          type: boolean
        explode: true
      - name: where
        description: "Query predicate to filter the results."
        in: query
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
        explode: true
      x-markDeprecated: true
      responses:
        '200':
          description: A paged list of custom objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomObjectPagedQueryResponse'
        '400':
          $ref: '#/components/responses/errorable_400'
        '401':
          $ref: '#/components/responses/errorable_401'
        '403':
          $ref: '#/components/responses/errorable_403'
        '404':
          $ref: '#/components/responses/errorable_404'
        '500':
          $ref: '#/components/responses/errorable_500'
        '502':
          $ref: '#/components/responses/errorable_502'
        '503':
          $ref: '#/components/responses/errorable_503'
    post:
      security:
      - oauth_2_0:
        - manage_products:{projectKey}
        - manage_orders:{projectKey}
        - manage_customers:{projectKey}
        - manage_key_value_documents:{projectKey}
      operationId: ByProjectKeyCustomObjectsPost
      summary: Create or update a custom object
      description: |-
        If an object with the given container/key exists, the object will be replaced with the new value and the version is incremented.
        If the request contains a version and an object with the given container/key, then the version must match the version of the existing object. Concurrent updates to the same Custom Object returns a [ConcurrentModification](ctp:api:type:ConcurrentModificationError) error even if the version is not provided.

        Fields within `value` that have `null` values **are not saved**.
      parameters:
      - name: expand
        description: "A field to expand. Reference fields can be expanded to include the referenced resource inline."
        in: query
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
        explode: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomObjectDraft'
        description: Custom object draft with container, key, value and optional version
      responses:
        '200':
          description: The updated custom object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomObject'
        '201':
          description: The created custom object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomObject'
        '400':
          $ref: '#/components/responses/errorable_400'
        '401':
          $ref: '#/components/responses/errorable_401'
        '403':
          $ref: '#/components/responses/errorable_403'
        '404':
          $ref: '#/components/responses/errorable_404'
        '500':
          $ref: '#/components/responses/errorable_500'
        '502':
          $ref: '#/components/responses/errorable_502'
        '503':
          $ref: '#/components/responses/errorable_503'
