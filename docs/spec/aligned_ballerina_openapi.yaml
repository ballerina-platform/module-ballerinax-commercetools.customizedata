  responses:
    errorable_400:
      description: "## Bad Request\n\nA 400 is the most commonly expected error response and indicates\
        \ that a request failed due to providing bad input.\nBad input can be a malformed request body,\
        \ missing required parameters, wrongly typed or malformed parameters or\na parameter that references\
        \ another resource that does not exist. Clients need to resolve the problems mentioned\nin the\
        \ response before re-sending the request.\n\nThe following general error codes can appear in responses\
        \ with the HTTP status code `400`:\n\n* `InvalidInput`\n  Invalid input has been sent to the service.\n\
        \  The client application should validate the input according to the constraints described in\
        \ the error message\n  before sending the request.\n\n* `InvalidOperation`\n  The resource(s)\
        \ involved in the request are not in a valid state for the operation. The client application\n\
        \  should validate the constraints described in the error message before sending the request.\n\
        \n* `InvalidField`\n  A field has an invalid value.\n  Extra fields:\n  * `field` - String\n \
        \   The name of the field.\n  * `invalidValue` - *\n    The invalid value.\n  * `allowedValues`\
        \ - Array of * - Optional\n    A fixed set of allowed values for the field, if any.\n\n* `RequiredField`\n\
        \  A required field is missing a value.\n  Extra fields:\n  * `field` - String\n    The name of\
        \ the field.\n\n* `DuplicateField`\n  A value for a field conflicts with an existing duplicate\
        \ value.\n  Extra fields:\n  * `field` - String\n    The name of the field.\n  * `duplicateValue`\
        \ - *\n    The offending duplicate value."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    errorable_401:
      description: '## Unauthorized


        A 401 indicates that the request is not properly authenticated.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    errorable_403:
      description: '## Forbidden


        A 403 indicates that the authenticated client is not allowed to perform the request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    errorable_404:
      description: "## Not Found\n\nA 404 indicates that the addressed resource was not found / does not\
        \ exist.\n\nThe following general error codes can appear in responses with the HTTP status code\
        \ `404`:\n\n* `ResourceNotFound`\n  The resource addressed by the request URL does not exist."
      content: {}
    errorable_500:
      description: "## Internal Server Error\n\nA 500 indicates that a request failed due to a server-side\
        \ problem that needs to be resolved before subsequent\nrequests can succeed. It either indicates\
        \ a temporary unavailability or permanent server-side problem that needs\nto be reported and resolved.\n\
        \nThe following general error codes can appear in responses with the HTTP status code `500`:\n\
        \n* `General`\n  A server-side problem occurred that is not further specified.\n  These errors\
        \ [should be reported](https://support.commercetools.com/)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    errorable_502:
      description: 'A 502 indicates that a request failed due to a server-side problem caused by scaling
        infrastructure resources.

        The client application should retry the request with exponential backoff up to a point where further
        delay is unacceptable.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    errorable_503:
      description: "## Service Unavailable\n\nThe following general error codes can appear in responses\
        \ with the HTTP status code `503`:\n\n* `OverCapacity`\n  The service is having trouble handling\
        \ the load. The client application should retry the request with\n  exponential backoff up to\
        \ a point where further delay is unacceptable.\n\n* `PendingOperation`\n  A previous conflicting\
        \ operation is still pending and needs to finish before the request can succeed.\n  The client\
        \ application should retry the request with exponential backoff up to a point where further delay\n\
        \  is unacceptable. If these errors persist, [should be reported](https://support.commercetools.com/)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    conflicting_409:
      description: "## Conflict\n\nA 409 indicates that the current version of the resource targeted by\
        \ the request (with the intention to modify or delete it) is different from that provided in the\
        \ request.\nIn response to this, the client will usually want to request the newest version of\
        \ the resource to see what has been changed and decide what changes to apply to the newest version.\n\
        \nA 409 Conflict indicates a concurrent modification and usually occurs on a versioned resource,\
        \ which requires the client to provide the version of the resource to perform a change.\n\nThe\
        \ following general error codes can appear in responses with the HTTP status code `409`:\n\n*\
        \ `ConcurrentModification`\n  The request conflicts with the current state of the involved resource(s).\n\
        \  Typically, the request attempts to modify a resource that is out of date,\n  i.e. that has\
        \ been modified by another client since the last time it was retrieved.\n  The client application\
        \ should resolve the conflict (with or without involving the end user)\n  before retrying the\
        \ request."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
